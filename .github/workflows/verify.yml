name: DOC OS Verify

on:
  pull_request:
    branches:
      - p2.4-experience-rebuild
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-os-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify DOC OS
        run: npm run verify
