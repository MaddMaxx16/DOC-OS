<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">DOC OS</title>
  <desc id="desc">Dispatch Operations Control workstation mark</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8d5e2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c760"/>
      <stop offset="1" stop-color="#c98a2d"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round">
    <path d="M42 34H302" stroke="#dce7f1" stroke-width="4" opacity=".72"/>
    <path d="M458 34H718" stroke="#d9a348" stroke-width="4" opacity=".88"/>
  </g>

  <!-- Keep the truck as a restrained brand accent: smaller and lifted clear of the OS letterforms. -->
  <g transform="translate(341 2) scale(.8)" fill="url(#amber)" aria-hidden="true">
    <rect x="0" y="4" width="64" height="24" rx="3"/>
    <path d="M64 10h19l14 11v7H64z"/>
    <rect x="78" y="13" width="8" height="7" rx="1" fill="#0a1726"/>
    <circle cx="18" cy="31" r="6" fill="#0a1726" stroke="#d8a044" stroke-width="3"/>
    <circle cx="55" cy="31" r="6" fill="#0a1726" stroke="#d8a044" stroke-width="3"/>
    <circle cx="83" cy="31" r="6" fill="#0a1726" stroke="#d8a044" stroke-width="3"/>
  </g>

  <text x="112" y="122" fill="url(#steel)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="-6">DOC</text>
  <rect x="374" y="63" width="4" height="62" rx="2" fill="#70879c" opacity=".78"/>
  <text x="402" y="122" fill="url(#amber)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="108" font-weight="760" letter-spacing="-6">OS</text>

  <text x="380" y="168" fill="#9fb2c4" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="8" text-anchor="middle">DISPATCH OPERATIONS CONTROL</text>
</svg>
